<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Health Records</title>
<meta name="application-name" content="Family Health Records">
<meta name="fmr-build" content="2026-09-06.3">
<meta name="theme-color" content="#103f46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json?v=20260906-3">
<link rel="apple-touch-icon" href="/icon.svg?v=20260906-3">
<link rel="stylesheet" href="/app.css?v=20260906-3">
<script>
  window.__FMR_BUILD__ = '2026-09-06.3';
  window.__showFmrBootError = function (message) {
    var main = document.getElementById('main');
    var title = document.getElementById('htitle');
    if (title) title.textContent = 'Could not open the app';
    if (main) main.innerHTML = '<div class="boot-error"><div class="boot-error-icon">!</div>' +
      '<h2>The app did not finish loading</h2><p>' + String(message || 'Please reload once.').replace(/[&<>]/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];}) + '</p>' +
      '<button onclick="location.reload()">Reload app</button><small>Build ' + window.__FMR_BUILD__ + '</small></div>';
  };
  window.addEventListener('error', function (event) {
    if (event && event.message) window.__showFmrBootError(event.message);
  });
  window.addEventListener('unhandledrejection', function (event) {
    var reason = event && event.reason;
    window.__showFmrBootError(reason && reason.message ? reason.message : String(reason || 'Unexpected loading error.'));
  });
  window.setTimeout(function () {
    var main = document.getElementById('main');
    if (main && main.dataset.ready !== 'true') window.__showFmrBootError('The connection took too long. Reload the app and try again.');
  }, 20000);
</script>
</head>
<body>
  <aside class="brand-rail" aria-label="Family Health Records">
    <span class="brand-mark" aria-hidden="true">+</span>
    <span class="brand-copy"><strong>Family Health</strong><small>Records</small></span>
  </aside>

  <header class="topbar">
    <button class="back" id="back" type="button" hidden aria-label="Go back">&#8592;</button>
    <div class="title-stack">
      <span class="eyebrow">Family health</span>
      <h1 class="htitle" id="htitle">Loading</h1>
    </div>
    <div class="hspace">
      <span class="build-pill" title="Current app release">06 Sep</span>
      <button class="avatar" id="avatar" type="button" title="Account and app information" aria-label="Open account menu"></button>
    </div>
  </header>

  <div class="people-wrap" aria-label="Choose a family member">
    <div class="people" id="people"></div>
  </div>

  <nav aria-label="Main navigation"><div class="navin" id="nav"></div></nav>

  <main id="main" aria-live="polite" aria-busy="true">
    <div class="boot-loading"><span></span><p>Opening your family health records…</p></div>
  </main>
  <div id="sheetHost"></div>

  <script type="module" src="/shell.js?v=20260906-3"></script>
</body>
</html>
